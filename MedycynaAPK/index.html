<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Medyczny</title>
    <style>
        :root {
            --bg-1: #eef4ff;
            --bg-2: #f6f7fb;
            --panel: #ffffff;
            --panel-alt: #f8fafc;
            --text: #2d3748;
            --heading: #0f172a;
            --muted: #475569;
            --label: #64748b;
            --card-border: #dfe7f1;
            --card-shadow: rgba(15, 23, 42, 0.04);
            --selected-bg-1: #dbeafe;
            --selected-bg-2: #eff6ff;
            --selected-border: #60a5fa;
            --primary-1: #2563eb;
            --primary-2: #1d4ed8;
            --primary-shadow: rgba(37, 99, 235, 0.25);
            --soft-btn-bg: #e2e8f0;
            --soft-btn-text: #0f172a;
        }

        body[data-theme="dark"] {
            --bg-1: #0f172a;
            --bg-2: #111827;
            --panel: #111827;
            --panel-alt: #1f2937;
            --text: #e2e8f0;
            --heading: #f8fafc;
            --muted: #cbd5e1;
            --label: #94a3b8;
            --card-border: #334155;
            --card-shadow: rgba(15, 23, 42, 0.5);
            --selected-bg-1: #1e3a5f;
            --selected-bg-2: #172554;
            --selected-border: #60a5fa;
            --primary-1: #3b82f6;
            --primary-2: #2563eb;
            --primary-shadow: rgba(59, 130, 246, 0.35);
            --soft-btn-bg: #1e293b;
            --soft-btn-text: #e2e8f0;
        }

        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 100%);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
        }
        .home-container {
            background: var(--panel);
            padding: 30px 28px 24px;
            border-radius: 18px;
            box-shadow: 0 18px 45px rgba(31, 41, 55, 0.12);
            max-width: 760px;
            width: 100%;
            border: 1px solid rgba(148, 163, 184, 0.18);
        }
        h1 {
            margin: 0 0 10px;
            font-size: 30px;
            color: var(--heading);
        }
        .subtitle {
            margin: 0 0 26px;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.6;
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .theme-toggle {
            border: none;
            background: var(--soft-btn-bg);
            color: var(--soft-btn-text);
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
        .selector-wrap {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .selector-label {
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--label);
            font-weight: 700;
        }
        .source-grid,
        .quiz-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }
        .source-card,
        .quiz-card {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 82px;
            padding: 16px 14px;
            border-radius: 14px;
            border: 1px solid var(--card-border);
            background: linear-gradient(180deg, var(--panel) 0%, var(--panel-alt) 100%);
            color: var(--heading);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease, border-color 0.2s ease;
            box-shadow: 0 2px 8px var(--card-shadow);
        }
        .source-card:hover,
        .quiz-card:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(59, 130, 246, 0.08);
            border-color: #93c5fd;
        }
        .source-card.is-selected,
        .quiz-card.is-selected {
            background: linear-gradient(135deg, var(--selected-bg-1) 0%, var(--selected-bg-2) 100%);
            border-color: var(--selected-border);
            box-shadow: 0 10px 22px rgba(59, 130, 246, 0.15);
        }
        .source-card small {
            display: block;
            margin-top: 6px;
            font-size: 12px;
            font-weight: 600;
            opacity: 0.8;
        }
        .actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 24px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--primary-1), var(--primary-2));
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 18px var(--primary-shadow);
        }
    </style>
</head>
<body>
    <div class="home-container">
        <div class="header-row">
            <h1>Quiz Medyczny</h1>
            <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Zmień motyw">🌙 Tryb ciemny</button>
        </div>
        <p class="subtitle">Wybierz źródło i zestaw pytań, a następnie przejdź do testu.</p>

        <div class="selector-wrap">
            <label class="selector-label">Źródło pytań</label>
            <div id="source-grid" class="source-grid"></div>
        </div>

        <div class="selector-wrap">
            <label class="selector-label">Wybierz zestaw pytań</label>
            <div id="quiz-grid" class="quiz-grid"></div>
        </div>

        <div class="actions">
            <button id="start-btn" class="btn" type="button">Rozpocznij quiz</button>
        </div>
    </div>

    <script src="pytania.js"></script>
    <script>
        function formatQuizLabel(key) {
            const labels = {
                konczynadolna: "Kończyna dolna",
                konczynagorna: "Kończyna górna",
                grzbiet: "Grzbiet",
                klatkaPiersiowa: "Klatka piersiowa",
                jamaBrzuszna: "Jama brzuszna",
                miednicaIKrocze: "Miednica i krocze",
                WiadomosciOgolneCzaszkaJamaCzaszki: "Wiadomości ogólne: Czaszka i Jama Czaszki"
            };

            if (labels[key]) {
                return labels[key];
            }

            return (key || "")
                .replace(/([a-z])([A-Z])/g, "$1 $2")
                .replace(/([A-Z]+)([A-Z][a-z])/g, "$1 $2")
                .replace(/_/g, " ")
                .replace(/\s+/g, " ")
                .trim()
                .replace(/^./, (char) => char.toUpperCase());
        }

        function getQuizSources() {
            const sets = typeof quizSets !== "undefined" ? quizSets : {};
            const keys = Object.keys(sets);

            if (keys.length) {
                return {
                    anatomiaGray: {
                        label: "Anatomia Graya",
                        description: "Zestawy z atlasu anatomii",
                        quizzes: keys.map((key) => ({ key, label: formatQuizLabel(key) }))
                    }
                };
            }

            return {
                anatomiaGray: {
                    label: "Anatomia Graya",
                    description: "Zestawy z atlasu anatomii",
                    quizzes: [
                        { key: "konczynadolna", label: "Kończyna dolna" },
                        { key: "konczynagorna", label: "Kończyna górna" },
                        { key: "grzbiet", label: "Grzbiet" },
                        { key: "klatkaPiersiowa", label: "Klatka piersiowa" },
                        { key: "jamaBrzuszna", label: "Jama brzuszna" },
                        { key: "miednicaIKrocze", label: "Miednica i krocze" },
                        { key: "WiadomosciOgolneCzaszkaJamaCzaszki", label: "Wiadomości ogólne: Czaszka i Jama Czaszki" }
                    ]
                }
            };
        }

        const quizSources = getQuizSources();

        function applyTheme(theme) {
            const selectedTheme = theme === "dark" ? "dark" : "light";
            document.body.setAttribute("data-theme", selectedTheme);
            localStorage.setItem("quiz-theme", selectedTheme);
            const toggleButton = document.getElementById("theme-toggle");
            if (toggleButton) {
                toggleButton.textContent = selectedTheme === "dark" ? "☀️ Tryb jasny" : "🌙 Tryb ciemny";
            }
        }

        let selectedSourceKey = "anatomiaGray";
        let selectedQuizKey = "konczynadolna";
        const sourceGrid = document.getElementById("source-grid");
        const quizGrid = document.getElementById("quiz-grid");
        const startBtn = document.getElementById("start-btn");
        const themeToggle = document.getElementById("theme-toggle");

        function renderSourceCards() {
            sourceGrid.innerHTML = Object.entries(quizSources).map(([key, source]) => `
                <button class="source-card ${selectedSourceKey === key ? "is-selected" : ""}" data-source-key="${key}">
                    <span>
                        ${source.label}
                        <small>${source.description}</small>
                    </span>
                </button>
            `).join("");

            sourceGrid.querySelectorAll(".source-card").forEach((button) => {
                button.addEventListener("click", () => {
                    selectedSourceKey = button.dataset.sourceKey;
                    const firstQuiz = quizSources[selectedSourceKey].quizzes[0];
                    selectedQuizKey = firstQuiz ? firstQuiz.key : selectedQuizKey;
                    renderSourceCards();
                    renderQuizCards();
                });
            });
        }

        function renderQuizCards() {
            const currentSource = quizSources[selectedSourceKey];
            quizGrid.innerHTML = currentSource.quizzes.map((quiz) => `
                <button class="quiz-card ${selectedQuizKey === quiz.key ? "is-selected" : ""}" data-quiz-key="${quiz.key}">
                    ${quiz.label}
                </button>
            `).join("");

            quizGrid.querySelectorAll(".quiz-card").forEach((button) => {
                button.addEventListener("click", () => {
                    selectedQuizKey = button.dataset.quizKey;
                    renderQuizCards();
                });
            });
        }

        function redirectToQuiz() {
            window.location.href = `quiz.html?quiz=${encodeURIComponent(selectedQuizKey)}`;
        }

        themeToggle.addEventListener("click", () => {
            const nextTheme = document.body.getAttribute("data-theme") === "dark" ? "light" : "dark";
            applyTheme(nextTheme);
        });

        const savedTheme = localStorage.getItem("quiz-theme") || "light";
        applyTheme(savedTheme);
        startBtn.addEventListener("click", redirectToQuiz);
        renderSourceCards();
        renderQuizCards();
    </script>
</body>
</html>
